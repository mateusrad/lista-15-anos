<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fila do Bar — 15 Anos Bárbara</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            background: linear-gradient(160deg, #f7dde6 0%, #f9ece8 50%, #f5d8e2 100%);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Container do topo para organizar o botão Voltar e o título */
        .top-navigation {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            margin-bottom: 0.5rem;
        }

        .btn-voltar {
            font-size: 11px;
            font-weight: 700;
            color: #c0607c;
            text-decoration: none;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 0.3rem;
            transition: color 0.2s ease;
            margin-bottom: 1rem;
        }

        .btn-voltar:hover { color: #b05570; }

        .logo-header {
            text-align: center;
            width: 100%;
            margin-bottom: 1.5rem;
        }

        .logo-header h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 26px;
            color: #b05570;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .logo-header p {
            font-size: 11px;
            font-weight: 700;
            color: #c98fa0;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            margin-top: 0.2rem;
        }

        .painel-fila {
            width: 100%;
            max-width: 800px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            height: calc(100vh - 160px);
        }

        .coluna {
            background: rgba(255, 255, 255, 0.6);
            border-radius: 24px;
            border: 1px solid rgba(240, 185, 200, 0.4);
            padding: 1.5rem;
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            box-shadow: 0 8px 32px rgba(180, 80, 110, 0.05);
        }

        .coluna-pronto {
            background: linear-gradient(175deg, #fff5f7 0%, #fdeef2 100%);
            border: 2px solid #e8b4c4;
            box-shadow: 0 10px 30px rgba(180, 80, 110, 0.1);
        }

        .coluna-titulo {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            text-align: center;
            margin-bottom: 1.2rem;
            padding-bottom: 0.6rem;
            border-bottom: 1.5px solid rgba(180, 80, 110, 0.15);
        }

        .titulo-preparando { color: #8c606d; }
        .titulo-pronto { color: #b05570; }

        .lista-nomes {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
        }

        .item-fila {
            background: #fff;
            padding: 0.9rem 1.2rem;
            border-radius: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(232, 180, 196, 0.2);
            box-shadow: 0 2px 6px rgba(200, 120, 150, 0.03);
        }

        .item-fila .nome {
            font-size: 13px;
            font-weight: 700;
            color: #555;
        }

        .item-fila .drink {
            font-size: 10px;
            font-weight: 600;
            color: #c98fa0;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            background: #faf2f4;
            padding: 0.25rem 0.6rem;
            border-radius: 6px;
        }

        .coluna-pronto .item-fila {
            border-color: #e8b4c4;
            background: #fff;
            animation: pulse-brilho 2s infinite alternate;
        }

        .coluna-pronto .item-fila .nome { color: #b05570; }
        .coluna-pronto .item-fila .drink { background: #fce8ef; color: #b05570; }

        @keyframes pulse-brilho {
            0% { box-shadow: 0 2px 6px rgba(180, 80, 110, 0.03); }
            100% { box-shadow: 0 4px 15px rgba(180, 80, 110, 0.15); border-color: #d4869e; }
        }

        @media (max-width: 600px) {
            .painel-fila { grid-template-columns: 1fr; height: auto; }
            .coluna { height: 350px; }
        }
    </style>
</head>
<body>

<div class="top-navigation">
    <a href="menu.html" class="btn-voltar">⬅ Voltar ao Menu</a>
</div>

<div class="logo-header">
    <h1>Bárbara • 15 Anos</h1>
    <p>Acompanhe o seu pedido</p>
</div>

<div class="painel-fila">
    <div class="coluna">
        <h2 class="coluna-titulo titulo-preparando">⏳ Preparando</h2>
        <div class="lista-nomes" id="listaPreparando">
        </div>
    </div>

    <div class="coluna coluna-pronto">
        <h2 class="coluna-titulo titulo-pronto">✨ Retirar no Balcão</h2>
        <div class="lista-nomes" id="listaPronto">
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "SUA_API_KEY",
        authDomain: "SEU_AUTH_DOMAIN",
        databaseURL: "SUA_DATABASE_URL",
        projectId: "SEU_PROJECT_ID",
        storageBucket: "SEU_STORAGE_BUCKET",
        messagingSenderId: "SEU_MESSAGING_SENDER_ID",
        appId: "SEU_APP_ID"
    };

    let database = null;
    try {
        if (firebaseConfig.apiKey !== "SUA_API_KEY") {
            const app = initializeApp(firebaseConfig);
            database = getDatabase(app);
        }
    } catch (e) {
        console.log("Firebase aguardando chaves.");
    }

    if (database) {
        const pedidosRef = ref(database, 'pedidos');

        onValue(pedidosRef, (snapshot) => {
            const divPreparando = document.getElementById('listaPreparando');
            const divPronto = document.getElementById('listaPronto');

            divPreparando.innerHTML = "";
            divPronto.innerHTML = "";

            if (!snapshot.exists()) return;

            const dados = snapshot.val();
            const lista = Object.keys(dados).map(key => dados[key]);

            lista.sort((a, b) => (b.dataHora || 0) - (a.dataHora || 0));

            lista.forEach((pedido) => {
                const item = document.createElement('div');
                item.className = 'item-fila';
                item.innerHTML = `
                    <span class="nome">${pedido.convidado}</span>
                    <span class="drink">${pedido.drink}</span>
                `;

                if (pedido.status === "pendente") {
                    divPreparando.appendChild(item);
                } else if (pedido.status === "pronto") {
                    divPronto.appendChild(item);
                }
            });
        });
    } else {
        // Simulação charmosa local se rodar direto sem chaves
        const divPreparando = document.getElementById('listaPreparando');
        divPreparando.innerHTML = `
            <div class="item-fila"><span class="nome">Mateus</span><span class="drink">Gin Tônica</span></div>
            <div class="item-fila"><span class="nome">Kelli</span><span class="drink">Soda Italiana</span></div>
        `;
        const divPronto = document.getElementById('listaPronto');
        divPronto.innerHTML = `
            <div class="item-fila"><span class="nome">Bárbara</span><span class="drink">Mojito Teen</span></div>
        `;
    }
</script>

</body>
</html>
