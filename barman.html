<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Barman — 15 Anos Bárbara</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            background: #1a080d; /* Um fundo escuro sofisticado para o ambiente do bar */
            color: #fff;
            padding: 1.5rem;
        }

        .container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
            border-bottom: 2px solid #b05570;
            padding-bottom: 1rem;
        }

        header h1 {
            font-size: 20px;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: #f7dde6;
        }

        header p {
            font-size: 12px;
            color: #c98fa0;
            margin-top: 0.3rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .fila-pedidos {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .card-pedido {
            background: linear-gradient(135deg, #2d121a 0%, #3d1c27 100%);
            border: 1px solid rgba(240, 185, 200, 0.2);
            border-radius: 18px;
            padding: 1.2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .info-pedido {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }

        .nome-convidado {
            font-size: 16px;
            font-weight: 700;
            color: #fff;
            letter-spacing: 0.05em;
        }

        .nome-drink {
            font-size: 13px;
            font-weight: 600;
            color: #f0b9c8;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .horario {
            font-size: 10px;
            color: #8c606d;
        }

        .btn-pronto {
            background: #b05570;
            color: white;
            border: none;
            padding: 0.8rem 1.4rem;
            border-radius: 12px;
            font-family: 'Montserrat', sans-serif;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 4px 10px rgba(176, 85, 112, 0.3);
        }

        .btn-pronto:hover {
            background: #96435c;
            transform: translateY(-1px);
        }

        .btn-pronto:active {
            transform: translateY(0);
        }

        .sem-pedidos {
            text-align: center;
            color: #8c606d;
            font-size: 14px;
            margin-top: 3rem;
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Painel do Bartender</h1>
        <p>Pedidos Pendentes em Tempo Real</p>
    </header>

    <div class="fila-pedidos" id="listaPedidosBarman">
        <!-- Os pedidos pendentes entram aqui via JavaScript -->
        <div class="sem-pedidos">Nenhum pedido na fila por enquanto...</div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // ⚠️ Configure com as mesmas chaves do seu banco Firebase
    const firebaseConfig = {
        apiKey: "SUA_API_KEY",
        authDomain: "SEU_AUTH_DOMAIN",
        databaseURL: "SUA_DATABASE_URL",
        projectId: "SEU_PROJECT_ID",
        storageBucket: "SEU_STORAGE_BUCKET",
        messagingSenderId: "SEU_MESSAGING_SENDER_ID",
        appId: "SEU_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);
    const pedidosRef = ref(database, 'pedidos');

    // Escuta mudanças no banco em tempo real
    onValue(pedidosRef, (snapshot) => {
        const listaContainer = document.getElementById('listaPedidosBarman');
        listaContainer.innerHTML = "";

        if (!snapshot.exists()) {
            listaContainer.innerHTML = '<div class="sem-pedidos">Nenhum pedido na fila por enquanto...</div>';
            return;
        }

        let totalPendentes = 0;
        const dados = snapshot.val();

        // Converte o objeto do Firebase em array e ordena por horário de envio (mais antigo primeiro)
        const listaOrdenada = Object.keys(dados).map(key => ({ id: key, ...dados[key] }));
        listaOrdenada.sort((a, b) => (a.dataHora || 0) - (b.dataHora || 0));

        listaOrdenada.forEach((pedido) => {
            // Só exibe no painel do barman se o status for 'pendente'
            if (pedido.status === "pendente") {
                totalPendentes++;

                // Formata o horário do envio do drink de forma simples
                let horaFormatada = "";
                if(pedido.dataHora) {
                    const data = new Date(pedido.dataHora);
                    horaFormatada = data.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
                }

                const card = document.createElement('div');
                card.className = 'card-pedido';
                card.innerHTML = `
                    <div class="info-pedido">
                        <span class="nome-convidado">${pedido.convidado}</span>
                        <span class="nome-drink">${pedido.drink}</span>
                        <span class="horario">Pedido às ${horaFormatada}</span>
                    </div>
                    <button class="btn-pronto" onclick="concluirPedido('${pedido.id}')">Concluir</button>
                `;
                listaContainer.appendChild(card);
            }
        });

        if (totalPendentes === 0) {
            listaContainer.innerHTML = '<div class="sem-pedidos">Todos os drinks foram entregues! 🍸</div>';
        }
    });

    // Função global para mudar o status do drink para pronto no Firebase
    window.concluirPedido = function(idPedido) {
        const pedidoEspecificoRef = ref(database, `pedidos/${idPedido}`);
        update(pedidoEspecificoRef, { status: "pronto" })
            .catch((error) => console.error("Erro ao atualizar status:", error));
    };
</script>

</body>
</html>
